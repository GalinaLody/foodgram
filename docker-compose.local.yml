volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: always
    env_file: .env.local
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env.local
    restart: always
    volumes:
      - static:/app/collected_static
      - media:/app/media
      - ./backend:/app  # локальный код монтируется в контейнер
    depends_on:
      db:
        condition: service_healthy
        restart: true

  frontend:
    build: ./frontend
    env_file: .env.local
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./nginx_gateway
    env_file: .env.local
    restart: always
    ports:
      - 8080:80
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - backend
      - frontend